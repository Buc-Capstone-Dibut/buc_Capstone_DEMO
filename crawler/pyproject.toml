[project]
name = "dibut-crawler"
version = "0.1.0"
description = "RSS Crawler for Dibut"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "supabase",
    "feedparser",
    "beautifulsoup4",
    "python-dotenv",
    "requests",
    "lxml",
    "google-generativeai",
    "apscheduler",
    "loguru",
    "firecrawl-py",
    "google-genai>=2.8.0",
]

[tool.setuptools]
packages = ["src"]

[dependency-groups]
maintenance = ["psycopg[binary]>=3.2.0,<4"]
